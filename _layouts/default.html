<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}"><span class="mark">q.</span><span>{{ site.title | escape }}</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <span>Made for thinking out loud.</span>
      <span>© {{ site.time | date: "%Y" }} {{ site.title | escape }}</span>
    </footer>
  </div>
</body>
</html>
